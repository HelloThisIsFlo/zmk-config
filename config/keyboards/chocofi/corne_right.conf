### ↔️ Config level 2/3: side (RIGHT half of every Chocofi)
# Overrides from 'corne.conf': none

### Right half = Central
# Handles the keymap + host Bluetooth. Its nice!view shows BT profile/sleep.
# Sleep timeouts come from 'corne.conf'
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

### 🔋 Left-half battery → host
# Central fetches the peripheral's battery and exposes it as a 2nd battery service,
# so tools like zmk-battery-center show both halves. May need a macOS re-pair.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
